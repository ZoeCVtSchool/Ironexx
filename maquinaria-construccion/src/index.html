<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ironex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" href="assets/IRONEX-removebg-preview.png">
  <link rel="shortcut icon" type="image/png" href="assets/IRONEX-removebg-preview.png">
  <link rel="apple-touch-icon" href="assets/IRONEX-removebg-preview.png">
  <style>
    .navbar {
      background: linear-gradient(90deg, #f5f8fc 0%, #edf2f8 22%, #e9eef6 45%, #edf2f8 70%, #f5f8fc 100%);
      box-shadow: 0 18px 40px rgba(10, 15, 26, 0.12);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(16, 24, 40, 0.08);
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 2rem;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 68px;
      box-sizing: border-box;
    }
    .brand-section {
      display: flex;
      align-items: center;
      margin-left: 0;
      padding-left: 0;
    }
    .logo-brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 0;
    }
    .logo-image-large {
      width: auto;
      height: 128px !important;
      display: block;
      object-fit: contain;
      border-radius: 0;
      box-shadow: none;
    }
    .nav-link {
      color: rgba(16, 24, 40, 0.88);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.96rem;
      padding: 12px 18px;
      border-radius: 10px;
    }
  </style>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
